EnableDefaultLinters: true

linters:
  ErbSafety:
    enabled: true
  FinalNewline:
    enabled: true
  Indentation:
    enabled: true
    type: space
  QuoteType:
    enabled: true
    type: double
  QuoteStyle:
    enabled: true
    type: double
  Rubocop:
    enabled: true
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      Layout/InitialIndentation:
        Enabled: false
      Layout/LineLength:
        Enabled: false
      Layout/TrailingEmptyLines:
        Enabled: false
      Layout/TrailingWhitespace:
        Enabled: false
      Naming/FileName:
        Enabled: false
      Style/FrozenStringLiteralComment:
        Enabled: false
      Lint/UselessAssignment:
        Enabled: false
      Rails/OutputSafety:
        Enabled: false
